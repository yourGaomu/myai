<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 20px;
    background: radial-gradient(circle at 50% 0%, #2b3550, #12151f 70%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8ecf5;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 2px; }
  .stage {
    width: min(960px, 100%);
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
  }
  svg { display: block; width: 100%; height: auto; }
  .controls { display: flex; align-items: center; gap: 14px; font-size: 14px; }
  .controls input[type=range] { width: 200px; accent-color: #f2a33a; }
  .controls button {
    background: #f2a33a; color: #1a1a1a; border: 0; border-radius: 8px;
    padding: 7px 16px; font-weight: 600; cursor: pointer;
  }
  .controls button:hover { background: #ffb851; }
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车</h1>

<div class="stage">
<svg id="scene" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="0.65" stop-color="#cfeefc"/>
      <stop offset="1" stop-color="#fff4dc"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff6c4"/>
      <stop offset="0.45" stop-color="#ffe27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3a8"/>
      <stop offset="1" stop-color="#7fbf8f"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cbf5f"/>
      <stop offset="1" stop-color="#4f9e47"/>
    </linearGradient>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e0d2"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a24a"/>
      <stop offset="1" stop-color="#e2702e"/>
    </linearGradient>

    <g id="cloud">
      <ellipse cx="0" cy="0" rx="46" ry="20" fill="#fff"/>
      <ellipse cx="-28" cy="4" rx="26" ry="15" fill="#fff"/>
      <ellipse cx="30" cy="5" rx="28" ry="14" fill="#fff"/>
      <ellipse cx="6" cy="-14" rx="26" ry="18" fill="#fff"/>
    </g>

    <path id="farHills" fill="url(#hillFar)"
      d="M0,330 Q110,270 225,300 T450,300 T675,290 T900,330 L900,440 L0,440 Z"/>

    <g id="nearHills">
      <path fill="url(#hillNear)"
        d="M0,385 C120,335 240,335 360,372 C480,405 600,322 720,342 C800,355 860,372 900,385 L900,440 L0,440 Z"/>
      <g>
        <rect x="148" y="330" width="6" height="26" fill="#6b4a2b"/>
        <circle cx="151" cy="322" r="18" fill="#3f8f3d"/>
        <rect x="628" y="318" width="6" height="28" fill="#6b4a2b"/>
        <circle cx="631" cy="308" r="20" fill="#3a873a"/>
        <rect x="668" y="324" width="5" height="22" fill="#6b4a2b"/>
        <circle cx="670" cy="316" r="14" fill="#47994a"/>
      </g>
    </g>
  </defs>

  <!-- 天空与太阳 -->
  <rect width="900" height="520" fill="url(#sky)"/>
  <circle cx="740" cy="90" r="90" fill="url(#sunGlow)"/>
  <circle cx="740" cy="90" r="38" fill="#ffe066"/>

  <!-- 云 -->
  <g id="clouds">
    <g id="cloudSet">
      <use href="#cloud" x="120" y="80" opacity="0.95"/>
      <use href="#cloud" x="430" y="55" transform="scale(1)" opacity="0.85"/>
      <use href="#cloud" x="640" y="150" opacity="0.8"/>
    </g>
    <use href="#cloudSet" x="900"/>
  </g>

  <!-- 远山 / 近山 -->
  <g id="farLayer"><use href="#farHills"/><use href="#farHills" x="900"/></g>
  <g id="nearLayer"><use href="#nearHills"/><use href="#nearHills" x="900"/></g>

  <!-- 草地与道路 -->
  <rect y="420" width="900" height="16" fill="#5aa64e"/>
  <rect y="435" width="900" height="85" fill="#4a4b55"/>
  <rect y="435" width="900" height="4" fill="#d9d6cc"/>
  <g id="dashes"></g>

  <!-- 速度线 -->
  <g id="speedLines" stroke="#ffffff" stroke-linecap="round" opacity="0.7"></g>

  <!-- 阴影 -->
  <ellipse cx="385" cy="441" rx="195" ry="8" fill="#000" opacity="0.22"/>

  <!-- 骑行整体 -->
  <g id="rig">
    <!-- 后轮 -->
    <g transform="translate(250 360)">
      <circle r="75" fill="none" stroke="#24252b" stroke-width="10"/>
      <circle r="69" fill="none" stroke="#b8bcc6" stroke-width="3"/>
      <g id="spinRear" class="spokes" stroke="#cfd3db" stroke-width="1.6"></g>
      <circle r="7" fill="#5c606b"/>
    </g>
    <!-- 前轮 -->
    <g transform="translate(520 360)">
      <circle r="75" fill="none" stroke="#24252b" stroke-width="10"/>
      <circle r="69" fill="none" stroke="#b8bcc6" stroke-width="3"/>
      <g id="spinFront" class="spokes" stroke="#cfd3db" stroke-width="1.6"></g>
      <circle r="7" fill="#5c606b"/>
    </g>

    <!-- 远侧曲柄与腿 -->
    <line id="crankFar" stroke="#3b3d45" stroke-width="6" stroke-linecap="round"/>
    <rect id="pedalFar" width="18" height="6" rx="2" fill="#2a2b30"/>
    <g id="pelicanBobFar">
      <path id="legFar" fill="none" stroke="#d9772a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path id="footFar" fill="#d9772a" d="M-8,-2 L20,-7 L24,0 L20,6 L-8,4 Z"/>

    <!-- 车架 -->
    <g stroke="#17a2a8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="250" y1="360" x2="375" y2="365"/>
      <line x1="250" y1="360" x2="352" y2="255"/>
      <line x1="352" y1="255" x2="375" y2="365"/>
      <line x1="352" y1="255" x2="495" y2="250"/>
      <line x1="375" y1="365" x2="503" y2="282"/>
      <line x1="495" y1="245" x2="505" y2="285" stroke-width="11"/>
      <line x1="505" y1="285" x2="520" y2="360" stroke-width="7"/>
    </g>
    <!-- 链条与齿盘 -->
    <g id="chain" fill="none" stroke="#555963" stroke-width="2.5" stroke-dasharray="4 3">
      <line x1="250" y1="352" x2="375" y2="345"/>
      <line x1="250" y1="368" x2="375" y2="385"/>
    </g>
    <circle cx="250" cy="360" r="9" fill="none" stroke="#6d717c" stroke-width="3"/>
    <g transform="translate(375 365)">
      <g id="chainring">
        <circle r="20" fill="#c4c8d0" stroke="#7b808b" stroke-width="3"/>
        <circle r="13" fill="none" stroke="#8d929c" stroke-width="2" stroke-dasharray="6 4"/>
      </g>
      <circle r="5" fill="#4b4e57"/>
    </g>
    <!-- 座杆与车座 -->
    <line x1="352" y1="255" x2="346" y2="238" stroke="#9aa0ab" stroke-width="6" stroke-linecap="round"/>
    <path d="M318,232 Q340,224 366,232 Q368,240 344,240 Q322,240 318,232 Z" fill="#2c2d33"/>
    <!-- 车把立管 -->
    <line x1="495" y1="246" x2="490" y2="224" stroke="#9aa0ab" stroke-width="6" stroke-linecap="round"/>
    <path d="M490,224 Q478,218 468,222 Q458,226 462,236" fill="none" stroke="#3a3c44" stroke-width="6" stroke-linecap="round"/>

    <!-- 鹈鹕主体（随踩踏轻微起伏） -->
    <g id="pelican">
      <!-- 尾羽 -->
      <path d="M306,182 L258,190 L270,198 L252,206 L272,210 L262,220 L308,212 Z" fill="#e8e2d3" stroke="#c9c1ae" stroke-width="2" stroke-linejoin="round"/>
      <!-- 远侧翅膀 -->
      <path d="M372,168 C412,150 452,186 472,214 C446,206 412,204 372,196 Z" fill="#cfc8b6"/>
      <!-- 身体 -->
      <ellipse cx="365" cy="186" rx="68" ry="42" transform="rotate(-15 365 186)" fill="url(#bodyShade)" stroke="#cbc3b0" stroke-width="2"/>
      <!-- 围巾飘带 -->
      <path id="scarf" fill="none" stroke="#e23b3b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 脖子 -->
      <path d="M396,172 C416,150 400,128 422,100" fill="none" stroke="#cbc3b0" stroke-width="27" stroke-linecap="round"/>
      <path d="M396,172 C416,150 400,128 422,100" fill="none" stroke="#fbf9f4" stroke-width="22" stroke-linecap="round"/>
      <!-- 围巾结 -->
      <ellipse cx="406" cy="150" rx="15" ry="7" transform="rotate(-12 406 150)" fill="#e23b3b"/>
      <ellipse cx="406" cy="148" rx="15" ry="3" transform="rotate(-12 406 148)" fill="#ff6a5c" opacity="0.6"/>

      <!-- 头部 -->
      <g id="head">
        <circle cx="431" cy="92" r="21" fill="#fbf9f4" stroke="#cbc3b0" stroke-width="2"/>
        <!-- 头顶冠羽 -->
        <path d="M418,76 Q410,62 420,58 Q422,68 428,72 Q430,60 440,60 Q436,70 438,74 Z" fill="#f6e7a8"/>
        <!-- 下喙皮囊 -->
        <g id="pouch">
          <path d="M447,97 L560,120 Q530,156 484,146 Q456,138 447,97 Z" fill="url(#pouchGrad)" stroke="#c45f25" stroke-width="1.5"/>
        </g>
        <!-- 上喙 -->
        <path d="M444,82 L558,110 Q574,114 566,124 L560,121 L446,99 Z" fill="#f4c04a" stroke="#c99325" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M450,90 L556,114" stroke="#d8a332" stroke-width="1.5"/>
        <!-- 眼睛 -->
        <circle cx="436" cy="88" r="7" fill="#f7c6c0"/>
        <g id="eye">
          <circle cx="437" cy="87" r="4" fill="#1d1d22"/>
          <circle cx="438.5" cy="85.5" r="1.4" fill="#fff"/>
        </g>
      </g>
    </g>

    <!-- 近侧曲柄与腿 -->
    <g id="pelicanBobNear">
      <path id="legNear" fill="none" stroke="#f08c34" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <line id="crankNear" stroke="#5a5d66" stroke-width="7" stroke-linecap="round"/>
    <rect id="pedalNear" width="20" height="7" rx="2" fill="#2a2b30"/>
    <path id="footNear" fill="#f08c34" stroke="#c96a1f" stroke-width="1.2" d="M-8,-2 L20,-8 L25,-1 L21,6 L-8,4 Z"/>

    <!-- 近侧翅膀（握住车把） -->
    <g id="wingNear">
      <path d="M362,170 C410,148 452,180 470,226 C450,218 414,214 362,204 Z" fill="#f4f0e6" stroke="#cbc3b0" stroke-width="2" stroke-linejoin="round"/>
      <path d="M420,206 C440,210 456,216 470,226 C460,212 448,196 436,186 Z" fill="#3a3a40"/>
      <path d="M384,178 C404,172 422,176 436,186" fill="none" stroke="#d8d0bc" stroke-width="2"/>
    </g>
    <!-- 车把握把 -->
    <rect x="455" y="228" width="12" height="9" rx="3" fill="#2a2b30" transform="rotate(-20 461 232)"/>
  </g>
</svg>
</div>

<div class="controls">
  <label for="speed">速度</label>
  <input id="speed" type="range" min="0" max="600" value="240">
  <button id="toggle">暂停</button>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);

  // 辐条
  for (const id of ["spinRear", "spinFront"]) {
    const g = $(id);
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      const l = document.createElementNS(NS, "line");
      l.setAttribute("x1", 0); l.setAttribute("y1", 0);
      l.setAttribute("x2", (Math.cos(a) * 68).toFixed(2));
      l.setAttribute("y2", (Math.sin(a) * 68).toFixed(2));
      g.appendChild(l);
    }
    const valve = document.createElementNS(NS, "rect");
    valve.setAttribute("x", 60); valve.setAttribute("y", -2);
    valve.setAttribute("width", 6); valve.setAttribute("height", 4);
    valve.setAttribute("fill", "#e23b3b");
    g.appendChild(valve);
  }

  // 路面虚线
  const dashes = $("dashes");
  for (let x = 0; x < 1000; x += 80) {
    const r = document.createElementNS(NS, "rect");
    r.setAttribute("x", x); r.setAttribute("y", 474);
    r.setAttribute("width", 42); r.setAttribute("height", 6);
    r.setAttribute("rx", 3); r.setAttribute("fill", "#f3e9c6");
    dashes.appendChild(r);
  }

  // 速度线
  const speedLines = $("speedLines");
  const lines = [
    { y: 200, len: 60, off: 0 },
    { y: 250, len: 90, off: 40 },
    { y: 300, len: 50, off: 90 },
    { y: 345, len: 70, off: 20 },
  ].map(d => {
    const l = document.createElementNS(NS, "line");
    l.setAttribute("stroke-width", 3);
    speedLines.appendChild(l);
    return { el: l, ...d };
  });

  const BB = { x: 375, y: 365 };
  const CRANK = 28;
  const WHEEL_R = 75;
  const L1 = 92, L2 = 96;

  const legPath = (hip, foot) => {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, L1 + L2 - 0.5);
    const base = Math.atan2(dy, dx);
    const c = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    const a = Math.acos(Math.max(-1, Math.min(1, c)));
    const ang = base - a;
    const knee = { x: hip.x + L1 * Math.cos(ang), y: hip.y + L1 * Math.sin(ang) };
    return `M${hip.x.toFixed(1)},${hip.y.toFixed(1)} L${knee.x.toFixed(1)},${knee.y.toFixed(1)} L${foot.x.toFixed(1)},${foot.y.toFixed(1)}`;
  };

  let speed = +$("speed").value;
  let running = true;
  let dist = 0, t = 0, last = performance.now();
  let nextBlink = 2.5, blinkUntil = 0;

  $("speed").addEventListener("input", e => speed = +e.target.value);
  $("toggle").addEventListener("click", () => {
    running = !running;
    $("toggle").textContent = running ? "暂停" : "继续";
    last = performance.now();
    if (running) requestAnimationFrame(frame);
  });

  const mod = (a, n) => ((a % n) + n) % n;

  function frame(now) {
    if (!running) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt;
    dist += speed * dt;

    const wheelAngle = dist / WHEEL_R;          // 弧度
    const crank = wheelAngle / 2.4;             // 齿比
    const wheelDeg = wheelAngle * 180 / Math.PI;
    const crankDeg = crank * 180 / Math.PI;

    // 车轮 & 齿盘
    $("spinRear").setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
    $("spinFront").setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
    $("chainring").setAttribute("transform", `rotate(${crankDeg.toFixed(2)})`);
    $("chain").setAttribute("stroke-dashoffset", (-crank * 20).toFixed(2));

    // 视差背景
    $("dashes").setAttribute("transform", `translate(${-mod(dist, 80)} 0)`);
    $("nearLayer").setAttribute("transform", `translate(${-mod(dist * 0.45, 900)} 0)`);
    $("farLayer").setAttribute("transform", `translate(${-mod(dist * 0.18, 900)} 0)`);
    $("clouds").setAttribute("transform", `translate(${-mod(dist * 0.06 + t * 8, 900)} 0)`);

    // 速度线
    const sAlpha = Math.min(1, speed / 300);
    speedLines.setAttribute("opacity", (0.7 * sAlpha).toFixed(2));
    for (const ln of lines) {
      const x = 220 - mod(dist * 1.2 + ln.off * 6, 260);
      ln.el.setAttribute("x1", x); ln.el.setAttribute("x2", x + ln.len);
      ln.el.setAttribute("y1", ln.y); ln.el.setAttribute("y2", ln.y);
    }

    // 路面颠簸
    const bump = Math.sin(dist / 37) * 0.8 + Math.sin(dist / 13) * 0.4;
    $("rig").setAttribute("transform", `translate(0 ${(bump * (speed > 0 ? 1 : 0)).toFixed(2)})`);

    // 身体随踩踏起伏
    const bob = Math.sin(crank * 2) * 2.4;
    const sway = Math.sin(crank) * 1.2;
    $("pelican").setAttribute("transform", `translate(${sway.toFixed(2)} ${bob.toFixed(2)})`);
    $("wingNear").setAttribute("transform", `translate(${(sway * 0.5).toFixed(2)} ${(bob * 0.6).toFixed(2)})`);

    // 头部点头 + 皮囊晃动
    const nod = Math.sin(crank * 2 + 0.6) * 3;
    $("head").setAttribute("transform", `rotate(${nod.toFixed(2)} 422 100)`);
    const wob = 1 + Math.sin(t * 9) * 0.05 + Math.sin(crank * 2) * 0.04;
    $("pouch").setAttribute("transform", `translate(0 ${(97 * (1 - wob)).toFixed(2)}) scale(1 ${wob.toFixed(3)})`);

    // 眨眼
    if (t > nextBlink) { blinkUntil = t + 0.14; nextBlink = t + 2 + Math.random() * 3; }
    const eyeS = t < blinkUntil ? 0.1 : 1;
    $("eye").setAttribute("transform", `translate(0 ${(87 * (1 - eyeS)).toFixed(2)}) scale(1 ${eyeS})`);

    // 围巾飘动
    const pts = [];
    for (let i = 0; i <= 7; i++) {
      const k = i / 7;
      const amp = 1.5 + k * (4 + speed / 60);
      pts.push({
        x: 400 - i * (14 + speed / 80),
        y: 152 + i * 2.2 + Math.sin(t * (6 + speed / 50) - i * 0.9) * amp,
      });
    }
    let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
      d += ` Q${pts[i].x.toFixed(1)},${pts[i].y.toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
    }
    $("scarf").setAttribute("d", d);

    // 曲柄、脚踏、腿
    const legs = [
      { a: crank, crankEl: "crankNear", pedalEl: "pedalNear", legEl: "legNear", footEl: "footNear", hip: { x: 352, y: 214 }, pw: 20, ph: 7 },
      { a: crank + Math.PI, crankEl: "crankFar", pedalEl: "pedalFar", legEl: "legFar", footEl: "footFar", hip: { x: 340, y: 210 }, pw: 18, ph: 6 },
    ];
    for (const L of legs) {
      const px = BB.x + Math.cos(L.a) * CRANK;
      const py = BB.y + Math.sin(L.a) * CRANK;
      const c = $(L.crankEl);
      c.setAttribute("x1", BB.x); c.setAttribute("y1", BB.y);
      c.setAttribute("x2", px.toFixed(1)); c.setAttribute("y2", py.toFixed(1));
      const p = $(L.pedalEl);
      p.setAttribute("x", (px - L.pw / 2).toFixed(1));
      p.setAttribute("y", (py - L.ph / 2).toFixed(1));

      const hip = { x: L.hip.x + sway, y: L.hip.y + bob };
      const foot = { x: px, y: py - L.ph / 2 - 2 };
      $(L.legEl).setAttribute("d", legPath(hip, foot));
      const tilt = Math.sin(L.a) * 12 - 4;
      $(L.footEl).setAttribute("transform", `translate(${foot.x.toFixed(1)} ${foot.y.toFixed(1)}) rotate(${tilt.toFixed(1)})`);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
