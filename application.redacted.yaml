myai:
  provider: openai
  protocol: openai-chat-completions
  auth_type: bearer
  base_url: https://mikasa,icu/v1
  api_key: "***REDACTED***"
  model: gpt-5.5

memory:
  extraction:
    # Empty means using the application default chat model.
    model_id: ""
  dream:
    # Empty means using the application default chat model.
    model_id: ""

mongo:
  uri: "mongodb://***REDACTED***@170.106.115.187:27017/"
  database: myai

redis:
  addr: 170.106.115.187:6379
  password: "***REDACTED***"
  db: 0

rag:
  id_node: 0

  embedding:
    models: []

  milvus:
    enabled: false
    address: ""
    username: ""
    password: ""
    database: default
    api_key: ""
    enable_tls: false
    collection_prefix: knowledge_vectors
    shards: 1

  local:
    enabled: false
    path: ""
    vector_path: ""
    max_open_connections: 4

  retrieval:
    candidate_multiplier: 3
    max_candidates: 100
    min_local_results: 3
    min_local_score: 0.55
    rrf_k: 60
    cache_remote_results: true

  document_processor:
    enabled: true
    python_executable: python
    script: ./document_processor/main.py
    transport: auto
    worker_count: 4
    max_pending_jobs: 32
    startup_timeout_seconds: 30
    timeout_seconds: 120
    shutdown_grace_seconds: 5
    max_document_size_mb: 512
    content_chunk_kb: 256
    chunk_batch_size: 64
    grpc_max_message_mb: 8
    temp_directory: ""

  minio:
    endpoint: ""
    access_key: ""
    secret_key: ""
    session_token: ""
    bucket: myai-knowledge
    region: ""
    use_ssl: false
    auto_create_bucket: true

thread:
  core: 5
  queueSize: 10

asset:
  shortener_base_url: http://localhost:18081
  upload_timeout_seconds: 60
  ttl_seconds: 604800
  max_visits: 0

sandbox:
  # local runs commands on the host without OS isolation. Use opensandbox for isolated subagent workspaces.
  provider: local
  opensandbox:
    endpoint: http://127.0.0.1:8090
    api_key: "***REDACTED***"
    use_server_proxy: true
    image: python:3.12-slim
    cpu: 500m
    memory: 512Mi
    sandbox_timeout_seconds: 300
    command_timeout_seconds: 60
    request_timeout_seconds: 30
    max_download_mb: 16

subagent:
  worker_count: 2
  queue_size: 32
  # Relative paths are resolved from the agent workspace.
  snapshot_root: .myai/subagent-snapshots

mcp:
  servers: []
