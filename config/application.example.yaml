image_generation:
  models: []
  # Example provider declarations (credentials can use environment references).
  # For Google Imagen on Vertex AI, set base_url to
  # https://LOCATION-aiplatform.googleapis.com/v1/projects/PROJECT/locations/LOCATION
  # and auth_type: google-adc. ADC refreshes credentials from the runtime identity.
  # models:
  #   - id: "vertex-imagen"
  #     name: "Imagen 4"
  #     provider: "google-vertex"
  #     protocol: "google-imagen"
  #     auth_type: "google-adc"
  #     base_url: "https://us-central1-aiplatform.googleapis.com/v1/projects/PROJECT_ID/locations/us-central1"
  #     model: "imagen-4.0-generate-001"
  #     enabled: true
  #     is_default: true
  #   - id: "gpt-image"
  #     name: "GPT Image"
  #     provider: "openai-compatible"
  #     protocol: "openai-images"
  #     auth_type: "bearer"
  #     base_url: "https://api.openai.com"
  #     api_key: "${IMAGE_MODEL_API_KEY}"
  #     model: "gpt-image-1"
  #     enabled: true
  #     is_default: true

myai:
  provider: "openai"
  protocol: "openai-chat-completions"
  auth_type: "bearer"
  base_url: ""
  api_key: ""
  model: "gpt-5.5"
  # Set these to the limits documented by your provider. Zero uses a conservative fallback.
  context_window_tokens: 0
  max_output_limit: 0

memory:
  extraction:
    model_id: ""
  dream:
    model_id: ""

mongo:
  uri: ""
  database: "myai"

redis:
  addr: ""
  password: ""
  db: 0

rag:
  id_node: 1
  embedding:
    models: []
  milvus:
    enabled: false
    address: ""
    username: ""
    password: ""
    database: "default"
    api_key: ""
    enable_tls: false
    collection_prefix: "knowledge_vectors"
    shards: 1
  local:
    enabled: false
    path: "/workspace/.myai/knowledge.db"
    vector_path: "/workspace/.myai/vectors.db"
    max_open_connections: 4
  retrieval:
    candidate_multiplier: 3
    max_candidates: 100
    min_local_results: 3
    min_local_score: 0.55
    rrf_k: 60
    cache_remote_results: true
  document_processor:
    enabled: false
    python_executable: "/opt/myai-venv/bin/python"
    script: "/app/document_processor/main.py"
    transport: "auto"
    worker_count: 2
    max_pending_jobs: 16
    startup_timeout_seconds: 30
    timeout_seconds: 120
    shutdown_grace_seconds: 5
    max_document_size_mb: 512
    content_chunk_kb: 256
    chunk_batch_size: 64
    grpc_max_message_mb: 8
    temp_directory: "/tmp"
  minio:
    endpoint: ""
    access_key: ""
    secret_key: ""
    session_token: ""
    bucket: "myai-knowledge"
    region: ""
    use_ssl: false
    auto_create_bucket: true

thread:
  core: 5
  queueSize: 10

workspace_history:
  path: "/var/lib/myai/history"

persistence:
  outbox:
    # Empty selects a private per-workspace database in the user config directory.
    path: ""
    max_pending: 10000
    max_entries: 20000
    max_bytes: 67108864
    retain_done: 10000

skill:
  root: "/app/skills"
  registry: ""

sandbox:
  provider: "local"
  opensandbox:
    endpoint: "http://127.0.0.1:8090"
    api_key: ""
    use_server_proxy: true
    image: "python:3.12-slim"
    cpu: "500m"
    memory: "512Mi"
    sandbox_timeout_seconds: 300
    command_timeout_seconds: 60
    request_timeout_seconds: 30
    max_download_mb: 16

subagent:
  worker_count: 2
  queue_size: 32
  snapshot_root: "/workspace/.myai/subagent-snapshots"

plugin:
  enabled: true
  root: "/workspace/plugins"

hooks:
  commands: []

mcp:
  servers: []

# 外部文件/短链 MCP：未知实际地址和 key 均留空，当前默认停用。
# 部署方设置 SHORT_LINKS_MCP_URL（包含 /api/mcp）和 SHORT_LINKS_API_KEY；key 仅由 Agent 持有。
# URL 为空不注册；服务可选不影响普通聊天启动，但文件操作缺服务/工具时明确失败，没有旧接口回退。
short_links:
  mcp_url: ""
