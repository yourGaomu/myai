name: myai-prod

services:
  relay:
    image: ${MYAI_RELAY_IMAGE:-myai-relay:latest}
    container_name: myai-relay
    restart: unless-stopped
    init: true
    environment:
      MYAI_RELAY_AGENT_TOKEN: ${MYAI_RELAY_AGENT_TOKEN}
      MYAI_RELAY_AGENT_USER: ${MYAI_AGENT_USER:-local}
      MYAI_RELAY_AGENT_DEVICE: ${MYAI_AGENT_DEVICE:-server-agent}
      MYAI_RELAY_AGENT_CREDENTIALS: ${MYAI_RELAY_AGENT_CREDENTIALS:-}
      # Allow local Expo Web development clients to upgrade WebSockets. Native
      # Android clients do not send an Origin header and are unaffected.
      MYAI_RELAY_ALLOWED_ORIGINS: "${MYAI_RELAY_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}"
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-myai}
    command:
      - relay
      - --addr
      - 0.0.0.0:18080
      - --urlConfig
      - /app/config/relay.yaml
    volumes:
      - ./config/relay.yaml:/app/config/relay.yaml:ro
    ports:
      - "127.0.0.1:18080:18080"
    networks:
      - myai

  agent:
    profiles:
      - agent
    image: ${MYAI_AGENT_IMAGE:-myai-agent:latest}
    container_name: myai-agent
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    depends_on:
      - relay
    environment:
      # Empty optional overrides preserve values from the mounted application YAML.
      # Custom MCP credentials require an explicit environment entry in an overlay.
      MYAI_RELAY_AGENT_TOKEN: ${MYAI_RELAY_AGENT_TOKEN}
      MYAI_PROVIDER: ${MYAI_PROVIDER:-}
      MYAI_PROTOCOL: ${MYAI_PROTOCOL:-}
      MYAI_AUTH_TYPE: ${MYAI_AUTH_TYPE:-}
      MYAI_BASE_URL: ${MYAI_BASE_URL:-}
      MYAI_API_KEY: ${MYAI_API_KEY:-}
      MYAI_MODEL: ${MYAI_MODEL:-gpt-5.5}
      MYAI_TEMPERATURE: ${MYAI_TEMPERATURE:-}
      MYAI_TOP_P: ${MYAI_TOP_P:-}
      MYAI_MAX_OUTPUT_TOKENS: ${MYAI_MAX_OUTPUT_TOKENS:-}
      MYAI_CONTEXT_WINDOW_TOKENS: ${MYAI_CONTEXT_WINDOW_TOKENS:-0}
      MYAI_MAX_OUTPUT_LIMIT: ${MYAI_MAX_OUTPUT_LIMIT:-0}
      MEMORY_EXTRACTION_MODEL_ID: ${MEMORY_EXTRACTION_MODEL_ID:-}
      MEMORY_DREAM_MODEL_ID: ${MEMORY_DREAM_MODEL_ID:-}
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-myai}
      REDIS_ADDR: ${REDIS_ADDR:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      SHORT_LINKS_MCP_URL: ${SHORT_LINKS_MCP_URL:-}
      SHORT_LINKS_API_KEY: ${SHORT_LINKS_API_KEY:-}
      RAG_ID_NODE: ${RAG_ID_NODE:-}
      RAG_MILVUS_ENABLED: ${RAG_MILVUS_ENABLED:-}
      RAG_MILVUS_ADDRESS: ${RAG_MILVUS_ADDRESS:-}
      RAG_MILVUS_USERNAME: ${RAG_MILVUS_USERNAME:-}
      RAG_MILVUS_PASSWORD: ${RAG_MILVUS_PASSWORD:-}
      RAG_MILVUS_DATABASE: ${RAG_MILVUS_DATABASE:-}
      RAG_MILVUS_API_KEY: ${RAG_MILVUS_API_KEY:-}
      RAG_MILVUS_ENABLE_TLS: ${RAG_MILVUS_ENABLE_TLS:-}
      RAG_MILVUS_COLLECTION_PREFIX: ${RAG_MILVUS_COLLECTION_PREFIX:-}
      RAG_MILVUS_SHARDS: ${RAG_MILVUS_SHARDS:-}
      RAG_LOCAL_ENABLED: ${RAG_LOCAL_ENABLED:-}
      RAG_LOCAL_PATH: ${RAG_LOCAL_PATH:-}
      RAG_LOCAL_VECTOR_PATH: ${RAG_LOCAL_VECTOR_PATH:-}
      RAG_LOCAL_MAX_OPEN_CONNECTIONS: ${RAG_LOCAL_MAX_OPEN_CONNECTIONS:-}
      RAG_RETRIEVAL_CANDIDATE_MULTIPLIER: ${RAG_RETRIEVAL_CANDIDATE_MULTIPLIER:-}
      RAG_RETRIEVAL_MAX_CANDIDATES: ${RAG_RETRIEVAL_MAX_CANDIDATES:-}
      RAG_RETRIEVAL_MIN_LOCAL_RESULTS: ${RAG_RETRIEVAL_MIN_LOCAL_RESULTS:-}
      RAG_RETRIEVAL_MIN_LOCAL_SCORE: ${RAG_RETRIEVAL_MIN_LOCAL_SCORE:-}
      RAG_RETRIEVAL_RRF_K: ${RAG_RETRIEVAL_RRF_K:-}
      RAG_RETRIEVAL_CACHE_REMOTE_RESULTS: ${RAG_RETRIEVAL_CACHE_REMOTE_RESULTS:-}
      RAG_DOCUMENT_PROCESSOR_ENABLED: ${RAG_DOCUMENT_PROCESSOR_ENABLED:-}
      RAG_DOCUMENT_PROCESSOR_PYTHON_EXECUTABLE: ${RAG_DOCUMENT_PROCESSOR_PYTHON_EXECUTABLE:-}
      RAG_DOCUMENT_PROCESSOR_SCRIPT: ${RAG_DOCUMENT_PROCESSOR_SCRIPT:-}
      RAG_DOCUMENT_PROCESSOR_WORKING_DIRECTORY: ${RAG_DOCUMENT_PROCESSOR_WORKING_DIRECTORY:-}
      RAG_DOCUMENT_PROCESSOR_TRANSPORT: ${RAG_DOCUMENT_PROCESSOR_TRANSPORT:-}
      RAG_DOCUMENT_PROCESSOR_WORKER_COUNT: ${RAG_DOCUMENT_PROCESSOR_WORKER_COUNT:-}
      RAG_DOCUMENT_PROCESSOR_MAX_PENDING_JOBS: ${RAG_DOCUMENT_PROCESSOR_MAX_PENDING_JOBS:-}
      RAG_DOCUMENT_PROCESSOR_STARTUP_TIMEOUT_SECONDS: ${RAG_DOCUMENT_PROCESSOR_STARTUP_TIMEOUT_SECONDS:-}
      RAG_DOCUMENT_PROCESSOR_TIMEOUT_SECONDS: ${RAG_DOCUMENT_PROCESSOR_TIMEOUT_SECONDS:-}
      RAG_DOCUMENT_PROCESSOR_SHUTDOWN_GRACE_SECONDS: ${RAG_DOCUMENT_PROCESSOR_SHUTDOWN_GRACE_SECONDS:-}
      RAG_DOCUMENT_PROCESSOR_MAX_DOCUMENT_SIZE_MB: ${RAG_DOCUMENT_PROCESSOR_MAX_DOCUMENT_SIZE_MB:-}
      RAG_DOCUMENT_PROCESSOR_CONTENT_CHUNK_KB: ${RAG_DOCUMENT_PROCESSOR_CONTENT_CHUNK_KB:-}
      RAG_DOCUMENT_PROCESSOR_CHUNK_BATCH_SIZE: ${RAG_DOCUMENT_PROCESSOR_CHUNK_BATCH_SIZE:-}
      RAG_DOCUMENT_PROCESSOR_GRPC_MAX_MESSAGE_MB: ${RAG_DOCUMENT_PROCESSOR_GRPC_MAX_MESSAGE_MB:-}
      RAG_DOCUMENT_PROCESSOR_TEMP_DIRECTORY: ${RAG_DOCUMENT_PROCESSOR_TEMP_DIRECTORY:-}
      RAG_MINIO_ENDPOINT: ${RAG_MINIO_ENDPOINT:-}
      RAG_MINIO_ACCESS_KEY: ${RAG_MINIO_ACCESS_KEY:-}
      RAG_MINIO_SECRET_KEY: ${RAG_MINIO_SECRET_KEY:-}
      RAG_MINIO_SESSION_TOKEN: ${RAG_MINIO_SESSION_TOKEN:-}
      RAG_MINIO_BUCKET: ${RAG_MINIO_BUCKET:-myai-knowledge}
      RAG_MINIO_REGION: ${RAG_MINIO_REGION:-}
      RAG_MINIO_USE_SSL: ${RAG_MINIO_USE_SSL:-false}
      RAG_MINIO_AUTO_CREATE_BUCKET: ${RAG_MINIO_AUTO_CREATE_BUCKET:-}
      ASSET_SHORTENER_BASE_URL: ${ASSET_SHORTENER_BASE_URL:-}
      ASSET_API_KEY: ${ASSET_API_KEY:-}
      ASSET_UPLOAD_TIMEOUT_SECONDS: ${ASSET_UPLOAD_TIMEOUT_SECONDS:-}
      ASSET_TTL_SECONDS: ${ASSET_TTL_SECONDS:-}
      ASSET_MAX_VISITS: ${ASSET_MAX_VISITS:-}
      WORKSPACE_HISTORY_PATH: /var/lib/myai/history
      PERSISTENCE_OUTBOX_PATH: ${PERSISTENCE_OUTBOX_PATH:-}
      PERSISTENCE_OUTBOX_MAX_PENDING: ${PERSISTENCE_OUTBOX_MAX_PENDING:-}
      PERSISTENCE_OUTBOX_MAX_ENTRIES: ${PERSISTENCE_OUTBOX_MAX_ENTRIES:-}
      PERSISTENCE_OUTBOX_MAX_BYTES: ${PERSISTENCE_OUTBOX_MAX_BYTES:-}
      PERSISTENCE_OUTBOX_RETAIN_DONE: ${PERSISTENCE_OUTBOX_RETAIN_DONE:-}
      SKILL_ROOT: ${SKILL_ROOT:-}
      SKILL_REGISTRY: ${SKILL_REGISTRY:-}
      MYAI_PYTHON_BIN: ${MYAI_PYTHON_BIN:-}
      SKILLHUB_BASH: ${SKILLHUB_BASH:-}
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-local}
      SANDBOX_OPENSANDBOX_ENDPOINT: ${SANDBOX_OPENSANDBOX_ENDPOINT:-http://myai-opensandbox-server:8090}
      SANDBOX_OPENSANDBOX_API_KEY: ${SANDBOX_OPENSANDBOX_API_KEY:-}
      SANDBOX_OPENSANDBOX_USE_SERVER_PROXY: ${SANDBOX_OPENSANDBOX_USE_SERVER_PROXY:-}
      SANDBOX_OPENSANDBOX_IMAGE: ${SANDBOX_OPENSANDBOX_IMAGE:-}
      SANDBOX_OPENSANDBOX_CPU: ${SANDBOX_OPENSANDBOX_CPU:-}
      SANDBOX_OPENSANDBOX_MEMORY: ${SANDBOX_OPENSANDBOX_MEMORY:-}
      SANDBOX_OPENSANDBOX_SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_OPENSANDBOX_SANDBOX_TIMEOUT_SECONDS:-}
      SANDBOX_OPENSANDBOX_COMMAND_TIMEOUT_SECONDS: ${SANDBOX_OPENSANDBOX_COMMAND_TIMEOUT_SECONDS:-}
      SANDBOX_OPENSANDBOX_REQUEST_TIMEOUT_SECONDS: ${SANDBOX_OPENSANDBOX_REQUEST_TIMEOUT_SECONDS:-}
      SANDBOX_OPENSANDBOX_MAX_DOWNLOAD_MB: ${SANDBOX_OPENSANDBOX_MAX_DOWNLOAD_MB:-}
      SUBAGENT_WORKER_COUNT: ${SUBAGENT_WORKER_COUNT:-}
      SUBAGENT_QUEUE_SIZE: ${SUBAGENT_QUEUE_SIZE:-}
      SUBAGENT_SNAPSHOT_ROOT: ${SUBAGENT_SNAPSHOT_ROOT:-}
      PLUGIN_ENABLED: ${PLUGIN_ENABLED:-}
      PLUGIN_ROOT: ${PLUGIN_ROOT:-}
      THREAD_CORE: ${THREAD_CORE:-}
      THREAD_QUEUESIZE: ${THREAD_QUEUESIZE:-}
    command:
      - agent
      - --server
      - ws://relay:18080/ws/agent
      - --user
      - ${MYAI_AGENT_USER:-local}
      - --device
      - ${MYAI_AGENT_DEVICE:-server-agent}
      - --workspace
      - /workspace
    volumes:
      - ./config/application.yaml:/app/resource/application.yaml:ro
      - ${MYAI_WORKSPACE_PATH:-./workspace}:/workspace
      - agent-history:/var/lib/myai/history
      - agent-user-config:/home/myai/.config/myai
    networks:
      - myai

volumes:
  agent-history:
  agent-user-config:

networks:
  myai:
    external: true
    name: ${INFRA_NETWORK:-myai-shared}
