<!doctype html>
<html lang="zh-CN">
<head>

<title>鹈鹕去兜风 · Coastal Field Notes</title>
<style>
  :root{color-scheme:light;--paper:#f6f2e8;--ink:#192f2d;--muted:#586560;--line:#d9d9ca;--red:#a8402a;--mono:ui-monospace,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}
  .page{width:min(1120px,calc(100% - 72px));margin:0 auto;padding:30px 0 24px}
  .mast,.intro,.controls,.footer{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .mast{padding-bottom:17px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:750;letter-spacing:.07em}
  .brand-mark{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:var(--ink);color:var(--paper)}
  .micro{font:600 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase}
  .mast .micro,.footer{color:var(--muted)}
  .intro{align-items:end;padding:26px 0 22px}
  .kicker{color:var(--red);margin:0 0 7px}
  h1{margin:0;font-size:clamp(36px,5.3vw,67px);line-height:1.08;letter-spacing:-.07em;font-weight:850}
  .intro-note{margin:0 0 3px;padding-left:15px;border-left:2px solid #ca674a;line-height:1.65;font-size:13px;color:var(--muted);white-space:nowrap}
  .intro-note strong{display:block;color:var(--ink);font-size:15px}
  .card{overflow:hidden;border:1px solid #b9c0ae;border-radius:17px;background:#fffcf2;box-shadow:0 12px 35px #233d2d0c}
  .scene{position:relative;isolation:isolate;background:#eec3a1;overflow:hidden}
  .art{width:100%;height:auto;display:block}
  .scene-label{position:absolute;top:5.1%;left:2.5%;z-index:1;display:flex;align-items:center;gap:7px;padding:7px 10px;background:#fff7e1e8;border:1px solid #59453333;border-radius:4px;color:#473a2e;font-size:10px}
  .scene-label span{width:6px;height:6px;border-radius:50%;background:#b8553d}
  .scene-number{position:absolute;top:5.1%;right:2.5%;z-index:1;color:#574536;text-align:right;font-size:10px}
  .controls{min-height:66px;padding:10px 16px;border-top:1px solid #bdc5b5}
  .playback{display:flex;align-items:center;gap:9px}
  button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 13px;border:1px solid #d8ddce;border-radius:7px;background:transparent;color:var(--ink);font:650 13px system-ui,"Microsoft YaHei",sans-serif;cursor:pointer}
  button:hover{background:#eeeee2}button:focus-visible{outline:2px solid #a8402a;outline-offset:3px}
  #play{background:var(--ink);border-color:var(--ink);color:#fffaf0;min-width:83px}#play:hover{background:#304b46}
  #play[data-playing="true"] .icon-start,#play[data-playing="false"] .icon-pause{display:none}
  #speed{min-width:66px;font-variant-numeric:tabular-nums}
  .timeline{display:flex;align-items:center;gap:10px;width:min(44%,355px);color:var(--muted)}
  .track{flex:1;height:3px;border-radius:99px;background:#e3e6da;overflow:hidden}
  .fill{height:100%;background:#ae5038;transform-origin:left;transform:scaleX(0)}
  .time{font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.045em}
  .footer{padding-top:15px;font-size:10px}
  @media(max-width:620px){.page{width:calc(100% - 28px);padding-top:15px}.mast{padding-bottom:12px}.intro{align-items:start;flex-direction:column;gap:10px;padding:20px 0 16px}.intro-note{font-size:12px}.intro-note strong{display:inline;margin-right:5px;font-size:12px}.scene-label{padding:4px 6px;font-size:8px}.scene-number{font-size:8px}.controls{gap:8px;padding:8px}.timeline{flex:1;max-width:155px;gap:5px}.time{font-size:9px}.footer{letter-spacing:.06em}}
</style>
</head>

<script>
  (() => {
    const el = id => document.getElementById(id);
    const play = el('play'), playText = el('play-text'), speed = el('speed');
    const rearWheel = el('rear-wheel'), frontWheel = el('front-wheel'), lane = el('lane');
    const rider = el('rider'), bike = el('bike'), shadow = el('shadow'), scarf = el('scarf');
    const rearLeg = el('rear-leg'), rearFoot = el('rear-foot'), frontLeg = el('front-leg');
    const frontShin = el('front-shin'), frontFoot = el('front-foot'), pedal = el('pedal'), crank = el('crank');
    const clouds = el('clouds'), gulls = el('gulls'), ripples = el('ripples');
    const progress = el('progress'), time = el('time');
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const speeds = [1, 1.5, 0.5];
    const loop = 12, tau = Math.PI * 2;
    let speedIndex = 0, phase = 0, previous = null, frame = 0, playing = false, shownSecond = -1;

    function render(t) {
      const angle = tau * t * 9 / loop;
      const wheelAngle = 360 * t * 6 / loop;
      const drift = 5 * Math.sin(tau * t * 2 / loop);
      const rise = -1.2 + 1.2 * Math.sin(angle * 2);
      const x = Math.cos(angle) * 23, y = Math.sin(angle) * 23;
      const fx = 578 + x, fy = 403 + y, rx = 578 - x, ry = 403 - y;
      const ft = `M547 ${261 + rise} Q${585 + x * .35} ${293 + y * .28} ${607 + x * .35} ${326 + y * .32} L${fx - 4} ${fy - 5}`;
      rearWheel.setAttribute('transform', `rotate(${wheelAngle})`);
      frontWheel.setAttribute('transform', `rotate(${wheelAngle})`);
      lane.setAttribute('patternTransform', `translate(${-160 * t * 18 / loop} 0)`);
      bike.setAttribute('transform', `translate(${drift} 0)`);
      rider.setAttribute('transform', `translate(${drift} ${rise})`);
      shadow.setAttribute('transform', `translate(${drift} 0)`);
      frontLeg.setAttribute('d', ft);
      frontShin.setAttribute('d', ft);
      rearLeg.setAttribute('d', `M553 ${264 + rise} Q${597 - .4 * x} ${290 - .2 * y} ${613 - .3 * x} ${324 - .3 * y} L${rx - 3} ${ry - 4}`);
      rearFoot.setAttribute('d', `M${rx - 4} ${ry - 4}q8-3 22 4`);
      frontFoot.setAttribute('d', `M${fx - 5} ${fy - 4}q9-3 24 4`);
      pedal.setAttribute('d', `M${fx - 6} ${fy + 3}h28`);
      for (const [key, value] of Object.entries({x1: rx, y1: ry, x2: fx, y2: fy})) crank.setAttribute(key, value);
      const flap = 7 * Math.sin(tau * t * 14 / loop);
      scarf.setAttribute('d', `M589 173C551 183 533 ${149 + flap} 485 ${150 + flap}l14 11-18 9C532 ${162 + flap} 548 199 587 189z`);
      clouds.setAttribute('transform', `translate(${12 * Math.sin(tau * t / loop)} 0)`);
      gulls.setAttribute('transform', `translate(${18 * Math.sin(tau * t / loop)} ${-4 * Math.sin(tau * t * 4 / loop)})`);
      ripples.setAttribute('opacity', .68 + .16 * Math.sin(tau * t * 3 / loop));
      progress.style.transform = `scaleX(${t / loop})`;
      const second = Math.floor(t);
      if (second !== shownSecond) {
        shownSecond = second;
        time.textContent = `00:${String(second).padStart(2, '0')} / 00:12`;
      }
    }

    function tick(now) {
      if (!playing) return;
      if (previous !== null) phase = (phase + Math.min(now - previous, 64) * speeds[speedIndex] / 1000) % loop;
      previous = now;
      render(phase);
      frame = requestAnimationFrame(tick);
    }

    function setPlaying(value) {
      if (playing === value) return;
      playing = value;
      play.dataset.playing = String(value);
      playText.textContent = value ? '暂停' : '播放';
      play.setAttribute('aria-label', value ? '暂停动画' : '播放动画');
      previous = null;
      if (value) frame = requestAnimationFrame(tick);
      else cancelAnimationFrame(frame);
    }

    play.addEventListener('click', () => setPlaying(!playing));
    speed.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % speeds.length;
      const rate = speeds[speedIndex];
      speed.textContent = `${rate}×`;
      speed.setAttribute('aria-label', `播放速度：${rate} 倍。点击切换`);
    });
    motion.addEventListener('change', event => { if (event.matches) setPlaying(false); });
    render(0);
    if (!motion.matches) setPlaying(true);
  })();
</script>
</body>
</html>
