<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 0%, #2b3a55 0%, #141b2b 70%);
    color: #e8edf5;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .08em; }
  .stage {
    width: min(960px, 100%);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .06);
  }
  svg { display: block; width: 100%; height: auto; }
  .controls {
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 14px;
  }
  .controls label { display: flex; align-items: center; gap: 8px; }
  button {
    font: inherit;
    color: #0f1626;
    background: #7ec8f2;
    border: 0;
    border-radius: 999px;
    padding: 8px 20px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #a3d8f6; }
  button:focus-visible, input:focus-visible { outline: 2px solid #ffd95a; outline-offset: 3px; }
  input[type="range"] { accent-color: #7ec8f2; width: 160px; }
  output { min-width: 3em; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="controls">
  <button id="toggle" type="button" aria-pressed="false">暂停</button>
  <label for="speed">速度
    <input id="speed" type="range" min="0.2" max="2" step="0.1" value="1">
  </label>
  <output id="speedOut" for="speed">1.0×</output>
</div>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const mod = (a, n) => ((a % n) + n) % n;
  const f = (n) => n.toFixed(2);
  const set = (el, attrs) => { for (const k in attrs) el.setAttribute(k, attrs[k]); };
  const make = (tag, parent, attrs = {}) => {
    const el = document.createElementNS(NS, tag);
    set(el, attrs);
    parent.appendChild(el);
    return el;
  };

  const BB = { x: 370, y: 365 };
  const CRANK_LEN = 32;
  const THIGH = 90;
  const SHIN = 88;
  const WHEEL_R = 74;
  const GEAR = 2.2;
  const BASE_CADENCE = Math.PI * 2 * 0.6;

  const state = {
    crank: 0,
    wheel: 0,
    dist: 0,
    time: 0,
    scarf: 0,
    speed: 1,
    paused: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
  };

  function buildSpokes(group, cx, cy) {
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      const b = a + (i % 2 ? 0.2 : -0.2);
      make('line', group, {
        x1: f(cx + Math.cos(a) * 8), y1: f(cy + Math.sin(a) * 8),
        x2: f(cx + Math.cos(b) * 63), y2: f(cy + Math.sin(b) * 63),
      });
    }
  }
  buildSpokes($('spokesRear'), 270, 360);
  buildSpokes($('spokesFront'), 510, 360);

  for (let x = 0; x <= 880; x += 80) {
    make('rect', $('dashes'), { x, y: 465, width: 38, height: 5, rx: 2.5 });
  }

  const clouds = [
    { x: 60, y: 70, s: 1 },
    { x: 320, y: 125, s: 0.65 },
    { x: 520, y: 55, s: 0.85 },
    { x: 800, y: 110, s: 0.75 },
    { x: 980, y: 60, s: 0.55 },
  ].map((c) => ({ ...c, el: make('use', $('clouds'), { href: '#cloud' }) }));

  const speedLines = [
    { y: 168, off: 0, len: 46 },
    { y: 200, off: 60, len: 32 },
    { y: 236, off: 125, len: 54 },
    { y: 290, off: 30, len: 28 },
    { y: 322, off: 160, len: 40 },
  ].map((s) => ({ ...s, el: make('line', $('speedLines')) }));

  function getLeg(id) {
    const g = $(id);
    const q = (p) => g.querySelector(`[data-part="${p}"]`);
    return { thighO: q('thighO'), thigh: q('thigh'), shinO: q('shinO'), shin: q('shin'), foot: q('foot') };
  }
  const legNear = getLeg('legNear');
  const legFar = getLeg('legFar');

  // 两段式腿的反向运动学，膝盖朝前弯曲
  function solveKnee(hx, hy, tx, ty) {
    const dx = tx - hx;
    const dy = ty - hy;
    const raw = Math.hypot(dx, dy) || 1;
    const ux = dx / raw;
    const uy = dy / raw;
    const d = Math.min(THIGH + SHIN - 0.5, Math.max(Math.abs(THIGH - SHIN) + 0.5, raw));
    const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
    return { x: hx + ux * a + uy * h, y: hy + uy * a - ux * h };
  }

  function drawLeg(leg, hip, angle, crankEl, pedalEl) {
    const px = BB.x + Math.cos(angle) * CRANK_LEN;
    const py = BB.y + Math.sin(angle) * CRANK_LEN;
    set(crankEl, { x1: BB.x, y1: BB.y, x2: f(px), y2: f(py) });
    set(pedalEl, { x: f(px - 12), y: f(py - 3.5) });

    const ankDeg = Math.sin(angle + 0.6) * 10 - 4;
    const r = ankDeg * Math.PI / 180;
    const c = Math.cos(r);
    const s = Math.sin(r);
    const fx = px;
    const fy = py - 5;
    const ax = fx + (-8) * c - (-6) * s;
    const ay = fy + (-8) * s + (-6) * c;

    const knee = solveKnee(hip.x, hip.y, ax, ay);
    const thighD = `M${f(hip.x)} ${f(hip.y)} L${f(knee.x)} ${f(knee.y)}`;
    const shinD = `M${f(knee.x)} ${f(knee.y)} L${f(ax)} ${f(ay)}`;
    leg.thighO.setAttribute('d', thighD);
    leg.thigh.setAttribute('d', thighD);
    leg.shinO.setAttribute('d', shinD);
    leg.shin.setAttribute('d', shinD);
    leg.foot.setAttribute('transform', `translate(${f(fx)} ${f(fy)}) rotate(${f(ankDeg)})`);
  }

  function ribbon(x0, y0, n, seg, w0, w1, phase, amp) {
    const top = [];
    const bot = [];
    let tipY = y0;
    for (let i = 0; i <= n; i++) {
      const s = i / n;
      const x = x0 - i * seg;
      const y = y0 - s * 8 + Math.sin(state.scarf - i * 0.75 + phase) * (0.5 + s * amp);
      const hw = (w0 + (w1 - w0) * s) / 2;
      top.push(`${f(x)} ${f(y - hw)}`);
      bot.push(`${f(x)} ${f(y + hw)}`);
      tipY = y;
    }
    const tipX = x0 - n * seg + seg * 0.9;
    return `M${top.join(' L')} L${f(tipX)} ${f(tipY)} L${bot.reverse().join(' L')} Z`;
  }

  const dustG = $('dust');
  const dust = [];
  let dustTimer = 0;
  function updateDust(dt) {
    dustTimer += dt * state.speed;
    while (dustTimer > 0.07) {
      dustTimer -= 0.07;
      dust.push({
        el: make('circle', dustG),
        x: 262 + Math.random() * 10,
        y: 431 - Math.random() * 4,
        vx: -(120 + Math.random() * 80) * state.speed,
        vy: -(10 + Math.random() * 25),
        r: 2 + Math.random() * 2.5,
        life: 0,
        max: 0.6 + Math.random() * 0.5,
      });
    }
    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.life += dt;
      if (p.life >= p.max) {
        p.el.remove();
        dust.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 15 * dt;
      const k = p.life / p.max;
      set(p.el, { cx: f(p.x), cy: f(p.y), r: f(p.r * (1 + k * 1.5)), opacity: f((1 - k) * 0.55) });
    }
  }

  const el = {
    rig: $('rig'),
    spinRear: $('spinRear'),
    spinFront: $('spinFront'),
    chainring: $('chainring'),
    chain: $('chain'),
    crankNear: $('crankNear'),
    crankFar: $('crankFar'),
    pedalNear: $('pedalNear'),
    pedalFar: $('pedalFar'),
    pouch: $('pouch'),
    eye: $('eye'),
    tail1: $('scarfTail1'),
    tail2: $('scarfTail2'),
    farHills: $('farHills'),
    nearHills: $('nearHills'),
    trees: $('trees'),
    dashes: $('dashes'),
    bob: document.querySelectorAll('.bob'),
    headbob: document.querySelectorAll('.headbob'),
  };

  function render() {
    const { crank, wheel, dist, time } = state;

    const wheelDeg = f(wheel * 180 / Math.PI);
    el.spinRear.setAttribute('transform', `rotate(${wheelDeg} 270 360)`);
    el.spinFront.setAttribute('transform', `rotate(${wheelDeg} 510 360)`);
    el.chainring.setAttribute('transform', `rotate(${f(crank * 180 / Math.PI)} 370 365)`);
    el.chain.setAttribute('stroke-dashoffset', f(crank * 21));
    el.rig.setAttribute('transform', `translate(0 ${f(Math.sin(dist * 0.11) * 0.5)})`);

    const bob = Math.sin(crank * 2) * 1.6;
    const headBob = Math.sin(crank * 2 + 0.9) * 1.8;
    const headRot = Math.sin(crank * 2 + 0.3) * 1.5;
    el.bob.forEach((g) => g.setAttribute('transform', `translate(0 ${f(bob)})`));
    el.headbob.forEach((g) => g.setAttribute('transform', `translate(0 ${f(headBob)}) rotate(${f(headRot)} 392 172)`));

    drawLeg(legFar, { x: 356, y: 220 + bob }, crank + Math.PI, el.crankFar, el.pedalFar);
    drawLeg(legNear, { x: 348, y: 224 + bob }, crank, el.crankNear, el.pedalNear);

    const pouchScale = 1 + Math.sin(crank * 2 + 1.4) * 0.05;
    el.pouch.setAttribute('transform', `translate(515 110) scale(1 ${f(pouchScale)}) translate(-515 -110)`);

    const blinkPhase = time % 3.6;
    const eyeScale = blinkPhase < 0.14 ? Math.max(0.08, Math.abs(1 - blinkPhase / 0.07)) : 1;
    el.eye.setAttribute('transform', `translate(439 83) scale(1 ${f(eyeScale)}) translate(-439 -83)`);

    const amp = 4 + 3 * state.speed;
    el.tail2.setAttribute('d', ribbon(384, 147, 10, 8, 8, 5, 1.2, amp));
    el.tail1.setAttribute('d', ribbon(384, 141, 12, 8.5, 9, 6, 0, amp));

    el.farHills.setAttribute('transform', `translate(${f(-mod(dist * 0.08, 800))} 0)`);
    el.nearHills.setAttribute('transform', `translate(${f(-mod(dist * 0.2, 800))} 0)`);
    el.trees.setAttribute('transform', `translate(${f(-mod(dist * 0.45, 800))} 0)`);
    el.dashes.setAttribute('transform', `translate(${f(-mod(dist, 80))} 0)`);

    clouds.forEach((c) => {
      const x = mod(c.x - dist * 0.03 * c.s, 1200) - 200;
      c.el.setAttribute('transform', `translate(${f(x)} ${c.y}) scale(${c.s})`);
    });

    speedLines.forEach((s) => {
      const p = mod(dist * 0.6 + s.off, 220) / 220;
      const x = 228 - p * 180;
      set(s.el, {
        x1: f(x), y1: s.y, x2: f(x - s.len), y2: s.y,
        opacity: f(Math.sin(p * Math.PI) * 0.6 * Math.min(1, state.speed)),
      });
    });
  }

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!state.paused) {
      const cadence = BASE_CADENCE * state.speed;
      state.crank += cadence * dt;
      state.wheel += cadence * GEAR * dt;
      state.dist += cadence * GEAR * WHEEL_R * dt;
      state.time += dt;
      state.scarf += dt * (5 + 6 * state.speed);
      updateDust(dt);
      render();
    }
    requestAnimationFrame(tick);
  }

  const toggle = $('toggle');
  const speedInput = $('speed');
  const speedOut = $('speedOut');
  const syncToggle = () => {
    toggle.textContent = state.paused ? '继续' : '暂停';
    toggle.setAttribute('aria-pressed', String(state.paused));
  };
  toggle.addEventListener('click', () => {
    state.paused = !state.paused;
    syncToggle();
  });
  speedInput.addEventListener('input', () => {
    state.speed = Number(speedInput.value);
    speedOut.textContent = `${state.speed.toFixed(1)}×`;
  });

  syncToggle();
  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
