[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myai-document-processor"
version = "0.1.0"
description = "Stateless document parsing and chunking service for MyAI"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.75,<2",
    "protobuf>=6.31,<7",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24,<2"]
docx = ["python-docx>=1.1,<2"]
all = ["PyMuPDF>=1.24,<2", "python-docx>=1.1,<2"]
dev = ["grpcio-tools>=1.75,<1.76"]
